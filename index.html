<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lola Monola</title>
<meta name="description" content="Lola Monola — zdjęcia i filmy.">
<meta property="og:title" content="Lola Monola">
<meta property="og:description" content="Zdjęcia i filmy Loli.">
<meta property="og:image" content="https://lolamonola.com/media/cover.webp">
<meta name="theme-color" content="#f6efe4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6efe4;
    --ink: #2b2118;
    --muted: #8a7560;
    --accent: #b97a3e;
    --card: #ebe0cf;
    --gap: 6px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 Inter, system-ui, sans-serif;
  }
  header {
    text-align: center; padding: clamp(48px, 9vw, 110px) 20px clamp(28px, 5vw, 56px);
  }
  .avatar {
    width: clamp(120px, 18vw, 170px); aspect-ratio: 1; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 auto 24px;
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 8px var(--accent), 0 18px 40px -12px rgba(80,50,20,.45);
  }
  h1 {
    font-family: Inter, system-ui, sans-serif; font-weight: 800;
    font-size: clamp(44px, 8vw, 88px); line-height: 1; margin: 0; letter-spacing: -0.04em;
  }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); margin-top: 14px; font-size: 15px; }

  nav.years {
    position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; gap: 4px;
    padding: 10px 12px; background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    overflow-x: auto; scrollbar-width: none;
  }
  nav.years a {
    color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 99px;
    font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .2s, color .2s;
  }
  nav.years a:hover { color: var(--ink); }
  nav.years a.on { background: var(--ink); color: var(--bg); }

  main { max-width: 1400px; margin: 0 auto; padding: 0 var(--gap) 80px; }
  section { padding-top: 36px; scroll-margin-top: 50px; }
  section h2 {
    font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em;
    margin: 0 8px 14px; display: flex; align-items: baseline; gap: 12px;
  }
  section h2 small { font: 400 14px Inter, sans-serif; color: var(--muted); }

  .row { display: flex; gap: var(--gap); margin-bottom: var(--gap); }
  .tile {
    position: relative; flex: none; background: var(--card); border-radius: 4px;
    overflow: hidden; cursor: zoom-in; padding: 0; border: 0;
  }
  .tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .4s, transform .5s;
  }
  .tile img.ok { opacity: 1; }
  .tile:hover img { transform: scale(1.03); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 5px;
    background: rgba(20,14,8,.62); color: #fff; font-size: 12px; font-weight: 500;
    padding: 3px 9px 3px 7px; border-radius: 99px; backdrop-filter: blur(4px);
  }
  .badge svg { width: 11px; height: 11px; fill: currentColor; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 20px 48px; }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50; background: #120d09;
    display: none; touch-action: pan-y pinch-zoom; user-select: none;
  }
  .lb.open { display: block; }
  .lb .stage { position: absolute; inset: 56px 56px; }
  .lb .stage img, .lb .stage video {
    position: absolute; inset: 0; margin: auto;
    width: auto; height: auto; max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  .lb button {
    position: absolute; background: none; border: 0; color: #fff; cursor: pointer;
    width: 56px; height: 56px; display: grid; place-items: center; opacity: .75;
  }
  .lb button:hover { opacity: 1; }
  .lb button svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; }
  .lb .x { top: 0; right: 0; }
  .lb .prev { left: 0; top: 50%; translate: 0 -50%; }
  .lb .next { right: 0; top: 50%; translate: 0 -50%; }
  .lb .cap {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    display: grid; place-items: center; color: rgba(255,255,255,.7); font-size: 14px;
  }
  .lb .top { position: absolute; top: 0; left: 16px; height: 56px; display: flex; align-items: center;
    color: rgba(255,255,255,.55); font-size: 13px; }
  @media (max-width: 640px) {
    .lb .prev, .lb .next { display: none; }
    .lb .stage { inset: 56px 0; }
  }
</style>
</head>
<body>
<header>
  <img class="avatar" id="avatar" alt="Lola">
  <h1>Lola <span>Monola</span></h1>
  <div class="meta" id="meta"></div>
</header>
<nav class="years" id="years"></nav>
<main id="gallery"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Podgląd">
  <div class="top" id="lbCount"></div>
  <div class="stage" id="stage"></div>
  <button class="x" id="lbClose" aria-label="Zamknij"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="prev" id="lbPrev" aria-label="Poprzednie"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="next" id="lbNext" aria-label="Następne"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="cap" id="lbCap"></div>
</div>

<script src="data.js?v=a99d2eef"></script>
<script>window.COVER = "096";</script>
<script>
(() => {
  const M = window.MEDIA;
  const months = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
  const monthsNom = ["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
  const fmtDate = (d) => { const [y,m,day] = d.slice(0,10).split("-"); return `${+day} ${months[m-1]} ${y}`; };
  const fmtDur = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const plural = (n, one, few, many) => n === 1 ? one : (n%10>=2 && n%10<=4 && (n%100<12 || n%100>14)) ? few : many;
  const play = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';

  // Header
  const photos = M.filter(m => m.type === "image").length, videos = M.length - photos;
  const first = M[0].date, last = M[M.length-1].date;
  const span = (d) => `${monthsNom[d.slice(5,7)-1]} ${d.slice(0,4)}`;
  document.getElementById("meta").textContent =
    `${photos} ${plural(photos,"zdjęcie","zdjęcia","zdjęć")} · ${videos} ${plural(videos,"film","filmy","filmów")} · ${span(first)} – ${span(last)}`;
  const cover = M.find(m => m.id === (window.COVER || "")) || [...M].reverse().find(m => m.type === "image");
  document.getElementById("avatar").src = window.COVER ? "media/avatar.webp" : `media/${cover.id}-t.webp`;

  // Group by year (newest first)
  const byYear = {};
  M.forEach((m, i) => { m.i = i; (byYear[m.date.slice(0,4)] ||= []).push(m); });
  const years = Object.keys(byYear).sort().reverse();
  const nav = document.getElementById("years"), gal = document.getElementById("gallery");
  years.forEach(y => {
    nav.insertAdjacentHTML("beforeend", `<a href="#y${y}" data-y="${y}">${y}</a>`);
    const n = byYear[y].length;
    gal.insertAdjacentHTML("beforeend",
      `<section id="y${y}" data-y="${y}"><h2>${y} <small>${n} ${plural(n,"zdjęcie","zdjęcia","zdjęć")}</small></h2><div class="rows"></div></section>`);
  });

  // Justified layout
  const io = new IntersectionObserver((es) => es.forEach(e => {
    if (e.isIntersecting) { const img = e.target; img.src = img.dataset.src; io.unobserve(img); }
  }), { rootMargin: "800px 0px" });

  function layout() {
    const W = gal.clientWidth - 2*parseFloat(getComputedStyle(gal).paddingLeft);
    const gap = 6;
    const target = W < 600 ? 150 : W < 1000 ? 220 : 280;
    document.querySelectorAll("section").forEach(sec => {
      const list = byYear[sec.dataset.y];
      const box = sec.querySelector(".rows");
      box.innerHTML = "";
      let row = [], sum = 0;
      const flush = (final) => {
        if (!row.length) return;
        const avail = W - gap*(row.length-1);
        let h = avail / sum;
        if (final && h > target*1.3) h = target;
        const div = document.createElement("div"); div.className = "row";
        row.forEach(m => {
          const b = document.createElement("button");
          b.className = "tile"; b.style.width = (h * m.w/m.h) + "px"; b.style.height = h + "px";
          b.setAttribute("aria-label", (m.type === "video" ? "Film, " : "Zdjęcie, ") + fmtDate(m.date));
          const img = new Image(); img.alt = ""; img.decoding = "async";
          img.dataset.src = `media/${m.id}-t.webp`;
          img.onload = () => img.classList.add("ok");
          b.append(img);
          if (m.type === "video") b.insertAdjacentHTML("beforeend", `<span class="badge">${play}${fmtDur(m.dur)}</span>`);
          b.onclick = () => openLb(m.i);
          div.append(b); io.observe(img);
        });
        box.append(div); row = []; sum = 0;
      };
      // newest first inside each year
      [...list].reverse().forEach(m => {
        row.push(m); sum += m.w/m.h;
        if ((W - gap*(row.length-1)) / sum <= target) flush(false);
      });
      flush(true);
    });
  }
  layout();
  let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(layout, 150); });

  // Active year in nav
  const navIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.y === e.target.dataset.y));
  }), { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("section").forEach(s => navIO.observe(s));

  // Lightbox — order follows the page (newest first)
  const order = years.flatMap(y => [...byYear[y]].reverse());
  const lb = document.getElementById("lb"), stage = document.getElementById("stage");
  let cur = -1, lastFocus;
  function show(k) {
    cur = (k + order.length) % order.length;
    const m = order[cur];
    stage.innerHTML = m.type === "video"
      ? `<video src="media/${m.id}.mp4" poster="media/${m.id}-t.webp" controls autoplay playsinline></video>`
      : `<img src="media/${m.id}.webp" alt="Lola, ${fmtDate(m.date)}">`;
    document.getElementById("lbCap").textContent = fmtDate(m.date);
    document.getElementById("lbCount").textContent = `${cur+1} / ${order.length}`;
    [order[(cur+1)%order.length], order[(cur-1+order.length)%order.length]]
      .forEach(n => { if (n.type === "image") new Image().src = `media/${n.id}.webp`; });
  }
  function openLb(i) {
    lastFocus = document.activeElement;
    lb.classList.add("open"); document.body.style.overflow = "hidden";
    show(order.findIndex(m => m.i === i));
    document.getElementById("lbClose").focus();
  }
  function closeLb() {
    lb.classList.remove("open"); stage.innerHTML = ""; document.body.style.overflow = "";
    lastFocus && lastFocus.focus();
  }
  document.getElementById("lbClose").onclick = closeLb;
  document.getElementById("lbPrev").onclick = () => show(cur-1);
  document.getElementById("lbNext").onclick = () => show(cur+1);
  stage.addEventListener("click", e => { if (e.target === stage) closeLb(); });
  addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowRight") show(cur+1);
    if (e.key === "ArrowLeft") show(cur-1);
  });
  let sx = null, sy = 0;
  lb.addEventListener("touchstart", e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLb();
  });
})();
</script>
</body>
</html>
